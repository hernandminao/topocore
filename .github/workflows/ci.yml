name: CI

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install GDAL (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin
          echo "GDAL_VERSION=$(gdal-config --version)" >> $GITHUB_ENV

      - name: Install dependencies
        run: uv sync --extra terrain --extra ml --extra lightgbm --extra xgboost --extra dxf --extra yaml --extra quality-report

      - name: Install GDAL Python bindings (matching system version)
        run: uv pip install --reinstall --no-cache --no-build-isolation "GDAL[numpy]==${{ env.GDAL_VERSION }}"

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: MyPy
        run: uv run --no-sync mypy src

      - name: Pytest
        run: uv run --no-sync pytest --cov=src/topocore --cov-report=term-missing